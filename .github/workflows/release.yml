# v で始まるタグ（例: v0.22.6）を push すると、各 OS 向けの実行ファイルと
# VS Code 拡張機能（.vsix）を作って、GitHub の Releases に置く。
#
#   git tag v0.22.6 && git push origin v0.22.6
#
# タグは internal/cli/cli.go の Version と同じでなければならない（違えば止まる）。
# 版に - が入るタグ（例: v0.23.0-rc.1）は試験版（pre-release）として置く。
# Actions のタブから、既にあるタグを指定して動かし直すこともできる
# （Makefile に version ターゲットがある、このワークフローを加えた後のタグに限る）。
#
# 安全のための決まり:
# - リポジトリに書き込める権限は、できたファイルを Releases に置く release ジョブだけが持つ。
# - Go の実行ファイルは、npm の依存パッケージを取り込まない binaries ジョブで作る。
#   npm の依存は vscode ジョブだけで、インストールスクリプトを動かさずに取り込む。
# - 外部のアクションはコミットで、npm の依存（.vsix を作る vsce を含む）はロックファイルで固定する。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例: v0.22.6）。既にあるタグを指定する"
        required: true

permissions:
  contents: read

# 同じタグのリリースを、タグの push と手動の実行とで同時に作らない
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      # 日本語を含むテストのため（POSIX ロケールでは Pandoc に渡す題名が化ける）
      LANG: C.UTF-8
    steps:
      # refs/tags/ を付けて、タグでないもの（ブランチ名など）を指定したら止める
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # go.mod の go 行は「使える最も古い版」なので、配る実行ファイルは
      # 標準ライブラリの修正が入った、サポート中の最新の Go で作る
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: タグと Version が一致するか確かめる
        run: |
          if ! version=$(make -s version); then
            echo "::error::このタグの Makefile には version ターゲットがありません（このワークフローより前のタグは、ここでは作れません）"
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::タグ $TAG と internal/cli/cli.go の Version ($version) が一致しません"
            exit 1
          fi

      - name: テスト
        run: make test

      - name: 実行ファイルを作る
        run: make dist

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # 依存パッケージのインストールスクリプトは動かさない。
      # 自分の postinstall（pdf.js のコピー）だけを、明示的に実行する
      - name: 依存パッケージを取り込む
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/copy-pdfjs.js

      - name: テスト
        run: npm test

      - name: VS Code 拡張機能を作る
        run: npm run package

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: vscode
          path: vscode/*.vsix
          if-no-files-found: error

  release:
    needs: [binaries, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true

      - name: チェックサムを作る
        run: cd dist && sha256sum * > SHA256SUMS

      - name: リリースを作る
        # bash -eo pipefail で動かし、途中の gh の失敗も見逃さない
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 作り直すときは、今回作らなかった古いファイル（前の版の .vsix など）を消してから置き直す
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            while read -r name; do
              if [ -n "$name" ] && [ ! -e "dist/$name" ]; then
                gh release delete-asset "$TAG" "$name" --yes
              fi
            done <<< "$names"
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            # 版に - が入るもの（v0.23.0-rc.1 など）は試験版にして、Latest にしない
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" dist/* --verify-tag "${prerelease[@]}" \
              --title "reportmd ${TAG#v}" --generate-notes
          fi
