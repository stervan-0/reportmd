# v で始まるタグ（例: v0.22.6）を push すると、各 OS 向けの実行ファイルと
# VS Code 拡張機能（.vsix）を作って、GitHub の Releases に置く。
#
#   git tag v0.22.6 && git push origin v0.22.6
#
# タグは internal/cli/cli.go の Version と同じでなければならない（違えば止まる）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例: v0.22.6）。既にあるタグを指定する"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: タグと Version が一致するか確かめる
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/cli/cli.go)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::タグ $TAG と internal/cli/cli.go の Version ($version) が一致しません"
            exit 1
          fi

      - name: テスト
        run: |
          make test
          cd vscode && npm ci --no-audit --no-fund && npm test

      - name: 実行ファイルを作る
        run: make dist

      - name: VS Code 拡張機能を作る
        run: |
          cd vscode && npm run package
          cp ./*.vsix ../dist/

      - name: チェックサムを作る
        run: cd dist && sha256sum * > SHA256SUMS

      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "reportmd ${TAG#v}" --generate-notes
          fi
